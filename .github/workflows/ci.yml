name: CI - Integracion Continua

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    name: Lint, Typecheck, Tests y Build
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificacion de tipos TypeScript (tsc)
        run: npx tsc --noEmit

      - name: Analisis de codigo (ESLint)
        run: npm run lint

      - name: Pruebas de esquemas y prompts (Zod)
        run: npm run test:prompts

      - name: Validacion de Version y CHANGELOG
        run: npm run verify:release

      - name: Build de produccion (Next.js)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-project.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key-for-ci-build"
